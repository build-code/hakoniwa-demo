<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>箱庭 v0</title>
<style>
html,body{margin:0;height:100%;background:#dedad2;font:13px system-ui;overflow:hidden}
#ui{position:fixed;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#ui button{font:13px system-ui;padding:6px 10px;border:1px solid #999;border-radius:6px;background:#fffc;cursor:pointer}
#ui button.on{background:#ffd54a}
/* 左上に常に見えるのは ⚙ と ♪ だけ（眺める画面なので薄く。触ると濃くなる）。残りは ⚙ の中 */
#ui .bar{display:flex;gap:6px}
#ui .bar button{opacity:.45;font-size:15px;padding:3px 9px;transition:opacity .2s}
#ui .bar button:hover,#ui .bar button.on{opacity:1}
#panel{display:none;background:#fffd;border:1px solid #bbb;border-radius:8px;padding:6px 10px 10px;width:290px;max-height:calc(100vh - 70px);overflow:auto;font-size:12px;box-shadow:0 2px 8px #0003}
#panel.open{display:block}
#panel h4{margin:8px 0 4px;font-size:11px;color:#777;font-weight:600}
#panel .row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#panel button{padding:4px 8px;font-size:12px}
#panel select,#panel input[type=text]{font:12px system-ui;max-width:100%}
#panel input[type=range]{flex:1;min-width:80px}
#panel .cast{display:flex;align-items:center;gap:4px;margin:3px 0}
#panel .cast .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#panel .cast select{max-width:88px}
#panel .cast.look{flex-wrap:wrap;padding-left:8px}
#strip{position:fixed;left:0;right:0;bottom:0;background:#0009;color:#ddd;padding:4px 10px;white-space:pre;font-size:12px;pointer-events:none;transition:background .3s;z-index:5}
#strip.err{background:#a01818ee;color:#fff}
#panel .cast.look select{max-width:78px;font-size:11px}
#panel .cast button{padding:2px 6px}
#hud{position:fixed;right:10px;top:10px;background:#fff9;padding:6px 8px;border-radius:6px;white-space:pre;font-size:12px}
/* キャラクリ: 右に枠のタブと部品の一覧。子は部屋の中に立たせて左寄りに見せる */
#chargen{position:fixed;right:10px;top:64px;bottom:10px;width:330px;background:#fffd;border:1px solid #bbb;border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 2px 8px #0003;display:flex;flex-direction:column;gap:6px}
#chargen[hidden]{display:none}
#chargen h3{margin:0;font-size:13px}
#chargen .tabs{display:flex;flex-wrap:wrap;gap:3px}
#chargen .tabs button{font:11px system-ui;padding:3px 7px;border:1px solid #999;border-radius:6px;background:#fffc;cursor:pointer}
#chargen .tabs button.on{background:#ffd54a}
#chargen .list{flex:1;overflow:auto;border-top:1px solid #ddd;border-bottom:1px solid #ddd;padding:4px 0}
#chargen .cg-row{display:flex;align-items:center;gap:6px;padding:2px 2px;cursor:pointer}
#chargen .cg-row:hover{background:#0000000a}
#chargen .cg-head{margin:6px 0 2px;font-size:11px;color:#777;font-weight:600;border-bottom:1px solid #ddd}
#chargen .cg-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chargen .cg-row input[type=color]{width:24px;height:18px;padding:0;border:1px solid #999}
#chargen .row{display:flex;gap:6px;align-items:center;font-size:11px;color:#555}
#chargen .row button{font:11px system-ui;padding:3px 8px;border:1px solid #999;border-radius:6px;background:#fffc;cursor:pointer}
#chargen .cg-row button{font:11px system-ui;padding:0 5px;border:1px solid #999;border-radius:4px;background:#fffc;cursor:pointer}
#chargen .foot{display:flex;gap:6px;justify-content:flex-end}
#chargen .foot button{font:13px system-ui;padding:6px 12px;border:1px solid #999;border-radius:6px;background:#fffc;cursor:pointer}
#chargen .foot button.ok{background:#ffd54a}
</style>
<script>
// 種を決められる乱数: window.__seed('2026-09-26-597') で Math.random を種つきの乱数（mulberry32）に替える。
// home.html の早回しの頭で呼ぶ＝同じ区切りの時刻から始めた世界は、いつ開いても同じ 1 本の流れになる。種を渡さなければ元の Math.random のまま
(function () {
  const orig = Math.random; let a = null;   // a: 種つきの乱数の中身（null＝元の Math.random）
  const seeded = () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  window.__seed = (str) => {
    if (str === null || str === undefined) { Math.random = orig; a = null; return; }
    let h = 1779033703 ^ String(str).length; for (let i = 0; i < String(str).length; i++) { h = Math.imul(h ^ String(str).charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    a = h >>> 0; Math.random = seeded;
  };
  // 乱数の続き: 引数なしで読み、数を渡すとそこから続ける（保存して再開する＝閉じたときと同じ乱数の並びで続く）
  window.__rngState = (v) => { if (v === undefined) return a; if (v === null) return; a = v; Math.random = seeded; };
  // ?seed= なら読み込みの最初から種つき（住人を作るときの乱数も揃える＝同じ時刻に開けば同じ姿）
  const sd = new URLSearchParams(location.search).get('seed'); if (sd !== null) window.__seed(sd);
})();
</script>

 "three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",

<body>
<div id="ui">
  <div class="bar"><button id="btnGear" title="設定">⚙</button><button id="btnMusic" title="音楽をかける / 止める">♪</button></div>
  <div id="panel">
    <h4>視点</h4>
    <div class="row"><button id="btnBox" class="on">箱庭（机の上）</button><button id="btnIn">中に入る</button><button id="btnEyes">この子の目</button><button id="btnMulti">マルチ</button></div>
    <div class="row" style="margin-top:6px"><button id="btnPlay">▶ 上演</button><button id="btnVoice" class="on">🔊 声</button><label title="カメラがゆっくり動く（酔うなら切る）"><input type="checkbox" id="chkDrift"> ゆっくり動く</label></div>
    <h4>明るさ</h4>
    <div class="row"><input id="brightRange" type="range" min="0.5" max="2.5" step="0.1" title="全部の灯を一律に倍する"><span id="brightLabel"></span></div>
    <h4>シーン</h4>
    <div class="row"><select id="selScene"></select><button id="btnPlaylist" hidden title="番組表のおまかせに戻す">番組表に戻す</button></div>
    <h4>刺激</h4>
    <div class="row"><label title="人が押すボタンを機械が時々押す（音楽・出来事・台本・視点・キュー・天候・立ち話・小道具・小芝居）。手で触ったら黙る"><input type="checkbox" id="chkAuto"> 自動刺激</label><label title="時間が来たらシーンを読み直して次へ。一覧は目次（全部）か ?tv= の番組表"><input type="checkbox" id="chkSwitch"> シーンも替える</label><span id="autoLabel"></span></div>
    <h4>時刻</h4>
    <div class="row"><input id="hourRange" type="range" min="0" max="24" step="0.25"><span id="hourLabel"></span><button id="btnHourReset">戻す</button></div>
    <h4>録画・再生</h4>
    <div class="row"><button id="btnRec" title="いまの場面を毎コマ記録する（姿勢・小道具・照明・時刻）。停止で .rec.gz を保存">● 録画</button><button id="btnRecStop" hidden>■ 停止して保存</button><button id="btnTake" hidden title="いまの録画をテイク（属性のない JSON）と住人ごとの VRMA に書き出す">⇩ テイク</button><button id="btnGltf" hidden title="開いているテイク（とショット）を 1 つの .glb に。部屋・小道具の動き・照明・カメラの軌道＋extras にテイク JSON">⇩ glTF</button><span id="recLabel"></span></div>
    <div class="row"><input type="file" id="fileReplay" accept=".gz,.json" hidden><button id="btnReplayOpen" title="録画（.rec.gz）を開いて再生する。視点は上のボタンで自由に">📂 再生</button><button id="btnReplayPlay" hidden>⏸</button><input id="replayRange" type="range" min="0" max="1" step="0.001" hidden style="width:110px"><span id="replayLabel"></span><button id="btnReplayExit" hidden title="再生をやめてシーンに戻る（読み直す）">やめる</button></div>
    <div hidden><input id="t2mText"><input id="t2mDur" type="number" value="6"><select id="t2mEngine"></select><button id="btnT2m"></button><button id="btnT2mSave"></button><span id="t2mLabel"></span><div id="t2mList"></div></div>
    <h4>住人</h4>
    <div id="castList"></div>
    <div class="row" style="margin-top:4px"><select id="selWho"></select><select id="selRole"><option value="dancer">踊る</option><option value="audience" selected>見る</option><option value="bystander">気にしない</option></select><button id="btnAdd" title="住人を足す">＋ 追加</button></div>
  </div>
</div>
<div id="hud">loading…</div>
<div id="strip" hidden></div>
<div id="chargen" hidden>
  <h3 id="cgTitle">見た目</h3>
  <div class="tabs" id="cgTabs"></div>
  <div class="row" id="cgTools"></div>
  <div class="list" id="cgList"></div>
  <div class="foot"><button id="cgCancel">やめる</button><button id="cgOk" class="ok">決定</button></div>
</div>
